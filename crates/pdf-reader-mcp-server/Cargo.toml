[package]
name = "pdf-reader-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust MCP server binary for @sylphx/pdf-reader-mcp"
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["mcp", "pdf", "rmcp", "agent"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pdf-reader-mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
pdf-reader-core = { path = "../pdf-reader-core", version = "3.1.1" }
rmcp = { version = "0.16.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }