[package]
name = "pdf-reader-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust hashing and indexing primitives for pdf-reader-mcp"

[lib]
path = "src/lib.rs"

[dependencies]
pdf-extract = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.12", default-features = true, features = ["tls"] }
url = "2"

[dev-dependencies]
tempfile = "3.20.0"
