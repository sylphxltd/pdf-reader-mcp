description = "JSON CLI for pdf-reader-core"

[[bin]]
name = "pdf-reader-cli"
path = "src/main.rs"

[dependencies]
pdf-reader-core = { path = "../pdf-reader-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"