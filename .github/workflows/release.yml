name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install provider certification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Check Code Quality (Biome)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build package
        run: bun run build

      - name: Build Rust MCP server
        run: bun run build:rust

      - name: Verify package tarball
        run: bun run package:smoke

      - name: Run Tests and Check Coverage
        run: bun run test:cov

      - name: Build docs
        run: bun run docs:build

      - name: Build release benchmark artifacts
        id: release-benchmarks
        continue-on-error: true
        env:
          MCP_PDF_BENCHMARK_OUTPUT_DIR: benchmark-artifacts
          MCP_PDF_OCR_PRESET: tesseract-tsv
          MCP_PDF_REGION_ANALYSIS_COMMAND: bun
          MCP_PDF_REGION_ANALYSIS_ARGS_JSON: '["scripts/reference-region-analysis-provider.mjs","{input}","{page}","{region_id}","{languages}"]'
        run: bun run benchmark:release-artifacts

      - name: Run SOTA release gate
        env:
          MCP_PDF_BENCHMARK_OUTPUT_DIR: benchmark-artifacts
        run: bun run benchmark:release-gate

      - name: Fail on release benchmark command failure
        if: ${{ steps.release-benchmarks.outcome == 'failure' }}
        run: exit 1

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-benchmark-artifacts
          path: benchmark-artifacts/
          if-no-files-found: ignore

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun changeset version && bun run sync:server-json
          publish: 'echo "PUBLISH FREEZE: verified-candidate artifact admission is not wired yet" && exit 1'
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          createGithubReleases: true
          commitMode: github-api
          github-token: ${{ steps.release-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          MCP_PDF_OCR_PRESET: tesseract-tsv
          MCP_PDF_REGION_ANALYSIS_COMMAND: bun
          MCP_PDF_REGION_ANALYSIS_ARGS_JSON: '["scripts/reference-region-analysis-provider.mjs","{input}","{page}","{region_id}","{languages}"]'
