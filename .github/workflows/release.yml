name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Code Quality (Biome)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build package
        run: bun run build

      - name: Verify package tarball
        run: bun run package:smoke

      - name: Run Tests and Check Coverage
        run: bun run test:cov

      - name: Build docs
        run: bun run docs:build

      - name: Build release benchmark artifacts
        id: release-benchmarks
        continue-on-error: true
        env:
          MCP_PDF_BENCHMARK_OUTPUT_DIR: benchmark-artifacts
          MCP_PDF_PROVIDER_BENCHMARK_REQUIRED: 'true'
        run: |
          bun run benchmark
          bun run benchmark:quality
          bun run benchmark:providers

      - name: Run SOTA release gate
        env:
          MCP_PDF_BENCHMARK_OUTPUT_DIR: benchmark-artifacts
        run: bun run benchmark:release-gate

      - name: Fail on release benchmark command failure
        if: ${{ steps.release-benchmarks.outcome == 'failure' }}
        run: exit 1

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-benchmark-artifacts
          path: benchmark-artifacts/
          if-no-files-found: ignore

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun changeset version
          publish: bun run release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          createGithubReleases: true
          commitMode: github-api
          github-token: ${{ steps.release-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
