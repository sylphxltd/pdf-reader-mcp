name: Native package scaffold

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/**'
      - 'scripts/native/**'
      - 'scripts/stage-rust-mcp.ts'
      - 'scripts/release-publish-with-natives.ts'
      - 'package.json'
      - 'scripts/smoke-native-launcher.ts'
      - 'scripts/smoke-native-package-resolve.ts'
      - 'bin/pdf-reader-mcp'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-package-scaffold.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packages/**'
      - 'scripts/native/**'
      - 'scripts/stage-rust-mcp.ts'
      - 'scripts/release-publish-with-natives.ts'
      - 'package.json'
      - 'scripts/smoke-native-launcher.ts'
      - 'scripts/smoke-native-package-resolve.ts'
      - 'bin/pdf-reader-mcp'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-package-scaffold.yml'

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: set
        run: |
          matrix='[{"platformId":"linux-x64-gnu","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"platformId":"linux-arm64-gnu","runner":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu"},{"platformId":"darwin-arm64","runner":["self-hosted","sylphx","macos","standard"],"target":"aarch64-apple-darwin"},{"platformId":"darwin-x64","runner":["self-hosted","sylphx","macos","standard"],"target":"x86_64-apple-darwin"},{"platformId":"win32-x64-msvc","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
          # Product CI: darwin uses Sylphx self-hosted macOS only (no GitHub-hosted macos-*).
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Verify package map and Stage B publishable posture
        run: |
          bun test test/native-platform-package-map.test.ts
          # dropInFor3014 may be true after sole-runtime authorization; still require publishable natives.
          jq -e '.productTruth.dropInFor3014 == true or .productTruth.dropInFor3014 == false' docs/specs/pure-rust-capability-matrix.json >/dev/null
          bun run native:sync-manifests
          bun run native:assert-ready -- --manifests-only --all
          # Packages are publishable (not private) but still not sole-runtime defaults.
          for pkg in packages/pdf-reader-mcp-*/package.json; do
            jq -e '(.private != true) and (.pdfReaderMcpNativeBinary != null)' "$pkg" >/dev/null
          done

  build:
    needs: map
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.map.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release server for ${{ matrix.platformId }}
        shell: bash
        run: |
          cargo build --release -p pdf-reader-mcp-server --target ${{ matrix.target }}
          if [[ "${{ matrix.platformId }}" == "win32-x64-msvc" ]]; then
            src="target/${{ matrix.target }}/release/pdf-reader-mcp-server.exe"
            dest="bin/native/${{ matrix.platformId }}/pdf-reader-mcp-server.exe"
          else
            src="target/${{ matrix.target }}/release/pdf-reader-mcp-server"
            dest="bin/native/${{ matrix.platformId }}/pdf-reader-mcp-server"
          fi
          mkdir -p "$(dirname "$dest")"
          cp "$src" "$dest"
          if [[ "${{ matrix.platformId }}" != "win32-x64-msvc" ]]; then
            chmod +x "$dest"
          fi
          ls -la "$dest"
      - name: Upload staged native binary
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-mcp-server-${{ matrix.platformId }}
          path: bin/native/${{ matrix.platformId }}/**
          if-no-files-found: error
      - name: Stage package/legacy paths and host runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platformId }}"
          if [[ "$platform" == "win32-x64-msvc" ]]; then
            bin_name="pdf-reader-mcp-server.exe"
          else
            bin_name="pdf-reader-mcp-server"
          fi
          staged="bin/native/${platform}/${bin_name}"
          test -f "$staged"
          mkdir -p "packages/pdf-reader-mcp-${platform}/bin" "bin/native"
          cp "$staged" "packages/pdf-reader-mcp-${platform}/bin/${bin_name}"
          cp "$staged" "bin/native/${bin_name}"
          if [[ "$platform" != "win32-x64-msvc" ]]; then
            chmod +x "$staged" "packages/pdf-reader-mcp-${platform}/bin/${bin_name}" "bin/native/${bin_name}"
          fi
          host_platform="$(bun -e 'import { resolveNativePlatformId } from "./scripts/native/platform-package-map.ts"; const id=resolveNativePlatformId(); if(!id) process.exit(2); process.stdout.write(id)')"
          if [[ "$host_platform" == "$platform" ]]; then
            bun run smoke:native-launcher
            bun run smoke:native-package-resolve
          else
            echo "Skipping host execute smoke for cross-target ${platform} on host ${host_platform}"
          fi
          bun scripts/native/assert-native-packages-ready.ts --platform=${{ matrix.platformId }}
