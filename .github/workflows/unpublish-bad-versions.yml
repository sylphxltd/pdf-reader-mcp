# Emergency: unpublish/yank premature pure-Rust cutover versions that broke users.
# npm: unpublish 3.0.15–3.1.1 (within 72h), restore latest → 3.0.14
# crates.io: yank 3.1.1 (crates cannot fully delete versions)
name: Unpublish bad versions

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UNPUBLISH to confirm'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: sylphx-linux-standard
    if: ${{ github.event.inputs.confirm == 'UNPUBLISH' }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Deprecate npm broken cutover versions + restore latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${NPM_TOKEN:-}"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          # npm forbids unpublish when dependents exist (E405). Deprecate instead.
          # Premature pure-Rust cutover chaos (2026-07-17). latest → 3.0.14.
          MSG='WITHDRAWN: incomplete pure-Rust cutover — do not use. Pin @sylphx/pdf-reader-mcp@3.0.14 (last known good).'
          for v in 3.1.1 3.1.0 3.0.18 3.0.17 3.0.16 3.0.15; do
            echo "=== npm deprecate @sylphx/citra@${v} ==="
            npm deprecate "@sylphx/citra@${v}" "$MSG"
          done
          echo "=== restore dist-tag latest → 3.0.14 ==="
          npm dist-tag add "@sylphx/pdf-reader-mcp@3.0.14" latest
          # Drop any non-latest tags that still point at withdrawn versions
          for tag in next pure-rust; do
            npm dist-tag rm @sylphx/citra "$tag" 2>/dev/null || true
          done
          echo "=== dist-tags ==="
          npm view @sylphx/citra dist-tags --json
          echo "=== deprecation sample ==="
          npm view @sylphx/citra@3.1.1 deprecated || true
          npm view @sylphx/citra@3.0.15 deprecated || true
          npm view @sylphx/citra version

      - name: Yank crates.io 3.1.1 (cannot fully unpublish)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          failed=0
          for crate in pdf-reader-core pdf-reader-mcp-server pdf-reader-cli; do
            echo "=== cargo yank ${crate}@3.1.1 ==="
            if ! cargo yank --vers 3.1.1 "$crate"; then
              echo "ERROR: yank ${crate}@3.1.1 failed (token needs yank permission for the publishing owner)"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::crates.io yank failed — owner must run: cargo yank --vers 3.1.1 pdf-reader-core (and mcp-server, cli) with a token that has yank permission for the publishing account"
            # Do not fail the job if npm deprecation already succeeded; surface as error annotation.
            exit 0
          fi
