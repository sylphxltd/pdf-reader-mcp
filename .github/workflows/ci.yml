name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

jobs:
  validate:
    name: Validate Code Quality
    runs-on: [self-hosted, sylphx-linux-standard]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: |
          # Dependabot doesn't update bun.lock, so we can't use --frozen-lockfile for its PRs
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Check Code Quality (Biome)
        run: bun run check

      - name: Build package
        run: bun run build

      - name: Run Tests and Check Coverage
        run: bun run test:cov

      - name: Detect coverage reports
        id: coverage
        shell: bash
        run: |
          if [[ -d coverage ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f coverage/lcov.info ]]; then
            echo "lcov=true" >> "$GITHUB_OUTPUT"
          else
            echo "lcov=false" >> "$GITHUB_OUTPUT"
          fi

          if compgen -G "coverage/*.xml" > /dev/null; then
            echo "test_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "test_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.coverage.outputs.lcov == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.coverage.outputs.test_results == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/*.xml
          report_type: test_results
          fail_ci_if_error: false

      - name: Upload coverage reports
        if: ${{ !cancelled() && steps.coverage.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage/
