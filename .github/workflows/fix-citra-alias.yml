name: Fix citra brand alias

# RETIRED workflow posture: brand is sole (@sylphx/citra). Do not dual-publish
# transitional packages as aliases of each other.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DISABLED'
        required: true
        type: string

jobs:
  disabled:
    if: ${{ inputs.confirm == 'DISABLED' }}
    runs-on: sylphx-linux-standard
    steps:
      - run: echo "Brand-sole hard cut: use release.yml to publish @sylphx/citra only."
