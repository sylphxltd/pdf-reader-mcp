name: Publish npm

# Admission-gated one-shot publish. dropInFor3014 remains false until sole-runtime proof.

# One-shot pure-Rust package publish for already-versioned package.json.
# Uses secrets.NPM_TOKEN. Does not re-run the heavy changesets release matrix.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type I_UNDERSTAND_USER_IMPACT to publish (admission gate still enforced)'
        required: true
        default: ''

jobs:
  publish:
    name: Publish @sylphx/pdf-reader-mcp
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'I_UNDERSTAND_USER_IMPACT' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Enforce verified-candidate admission
        run: bun scripts/check-verified-candidate-admission.ts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and stage pure-Rust MCP binary
        run: bun run build:rust

      - name: Production contract
        run: bun run check:production-contract

      - name: Package smoke
        run: bun run package:smoke

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${NPM_TOKEN:-}"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          npm publish --access public
          npm view @sylphx/pdf-reader-mcp version
