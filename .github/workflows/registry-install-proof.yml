name: Registry install proof

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to prove
        required: true
        type: string
        default: "5.0.0"

permissions:
  contents: read

jobs:
  proof-linux-x64:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Registry install + pure-Rust initialize proof (linux-x64-gnu)
        env:
          PROOF_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${PROOF_VERSION}"
          test -n "$VERSION"
          bun scripts/check-registry-install-proof.ts --registry --version="$VERSION"

  proof-linux-arm64:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Registry install proof (linux-arm64-gnu)
        env:
          PROOF_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${PROOF_VERSION}"
          bun scripts/check-registry-install-proof.ts --registry --version="$VERSION"

  proof-darwin:
    runs-on: [self-hosted, sylphx, macos, standard]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Registry install proof (darwin host)
        env:
          PROOF_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${PROOF_VERSION}"
          bun scripts/check-registry-install-proof.ts --registry --version="$VERSION"

  proof-windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Registry install proof (win32-x64)
        shell: bash
        env:
          PROOF_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${PROOF_VERSION}"
          bun scripts/check-registry-install-proof.ts --registry --version="$VERSION"
