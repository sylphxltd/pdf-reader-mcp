# pdf-reader-mcp read_pdf + stdio transport TS↔Rust differential parity (rej-010).
# Adopts rust-parity-drift-pass control-plane template: map-and-stale + differential + fan-in.
name: rust-parity-differential

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # Bind cancellation to one immutable candidate. A wedged runner proving an
  # older candidate must not block admission proof for a newer exact head.
  group: rust-parity-differential-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  map-and-stale:
    name: rust-parity-drift-pass/map-and-stale
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale_capabilities: ${{ steps.map.outputs.stale }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Map changed files to capabilities
        id: map
        env:
          MANIFEST: docs/specs/pdf-reader-mcp-parity-slice.json
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          CHANGED_FILE="${RUNNER_TEMP}/pdf-reader-mcp-changed-files.txt"
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" >"${CHANGED_FILE}" 2>/dev/null \
            || git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" >"${CHANGED_FILE}"
          python3 - "${MANIFEST}" "${CHANGED_FILE}" <<'PY' >>"${GITHUB_OUTPUT}"
          import json, sys, fnmatch
          manifest, changed_file = sys.argv[1:3]
          with open(changed_file, encoding="utf-8") as stream:
              changed_raw = stream.read()
          changed = [l.strip() for l in changed_raw.splitlines() if l.strip()]
          data = json.load(open(manifest))
          caps = list(data.get("capabilities") or [])
          for d in data.get("domains") or []:
              if isinstance(d, dict) and d.get("id"):
                  caps.append(d)
          stale = []
          for cap in caps:
              globs = (cap.get("proof") or {}).get("dependencyGlobs") or cap.get("dependencyGlobs") or []
              ts = cap.get("tsSurface") or ""
              if ts and any(ts in c or c.endswith(ts.split("#")[-1]) for c in changed):
                  stale.append(cap["id"])
              for g in globs:
                  if any(fnmatch.fnmatch(c, g) for c in changed):
                      stale.append(cap["id"])
                      break
          print(f"stale={json.dumps(sorted(set(stale)))}")
          PY

  differential:
    name: rust-parity-drift-pass/differential
    needs: map-and-stale
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
      DIFFERENTIAL_SCRIPT: scripts/run-pdf-reader-differential.sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Configure differential scratch directory
        run: echo "SCRATCH_DIR=${RUNNER_TEMP}/pdf-reader-mcp-differential" >>"${GITHUB_ENV}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run differential harness
        run: bash "${DIFFERENTIAL_SCRIPT}"

      - name: Enforce honest matrix and pure-Rust capability contract
        env:
          PDF_READER_ENGINE_MODE: pure-rust
          RUN_PURE_RUST_CAPABILITY: "1"
        run: |
          bun run check:pure-rust-matrix
          bun run test:v3014-structure-differential
          bun run test:v3014-citation-chunk-differential
          bun run test:v3014-semantic-hint-differential
          bun run test:v3014-document-ast-differential
          bun run test:v3014-document-map-differential
          bun run test:v3014-trust-report-differential
          bun run test:v3014-selectable-table-differential
          bun run test:v3014-caption-link-differential
          bun run test:v3014-search-semantic-differential -- --output "${SCRATCH_DIR}/v3014-search-semantic-result.json"
          bun run test:v3014-lowercase-index-differential -- --output "${SCRATCH_DIR}/v3014-lowercase-index-result.json"
          bun run test:v3014-selectable-text-segmentation-differential -- --output "${SCRATCH_DIR}/v3014-selectable-text-segmentation-result.json"
          bun run test:v3014-ocr-search-differential -- --output "${SCRATCH_DIR}/v3014-ocr-search-result.json"
          bun run test:v3014-raster-image-differential -- --output "${SCRATCH_DIR}/v3014-raster-image-result.json"
          bun run test:v3014-visual-candidate-differential -- --output "${SCRATCH_DIR}/v3014-visual-candidate-result.json"
          bun run test:v3014-visual-fusion-differential -- --output "${SCRATCH_DIR}/v3014-visual-fusion-result.json"
          bun run test:v3014-document-ast-visual-fusion-differential -- --output "${SCRATCH_DIR}/v3014-document-ast-visual-fusion-result.json"
          bun run test:v3014-read-ocr-differential -- --output "${SCRATCH_DIR}/v3014-read-ocr-result.json"
          bun run test:v3014-read-ocr-residual-differential -- --output "${SCRATCH_DIR}/v3014-read-ocr-residual-result.json"
          bun run test:v3014-ocr-tsv-differential -- --output "${SCRATCH_DIR}/v3014-ocr-tsv-result.json"
          bun run test:v3014-ocr-table-merge-differential -- --output "${SCRATCH_DIR}/v3014-ocr-table-merge-result.json"
          bun run test:v3014-ocr-search-residual-differential -- --output "${SCRATCH_DIR}/v3014-ocr-search-residual-result.json"
          bun run test:v3014-ocr-search-interleave-differential -- --output "${SCRATCH_DIR}/v3014-ocr-search-interleave-result.json"
          bun run test:capability-parity

      - name: Assert proof SHA binding
        run: |
          set -euo pipefail
          ARTIFACT="${SCRATCH_DIR}/verification.json"
          if [ ! -f "$ARTIFACT" ]; then
            echo "::error::verification artifact missing at $ARTIFACT"
            exit 1
          fi
          LAST_COMPARED="$(jq -r '.lastComparedMainSha' "$ARTIFACT")"
          STATUS="$(jq -r '.status' "$ARTIFACT")"
          if [ "$STATUS" != "claimed_subset_green" ]; then
            echo "::error::verification status must be claimed_subset_green (got $STATUS)"
            exit 1
          fi
          if [ "$LAST_COMPARED" != "$CANDIDATE_SHA" ]; then
            echo "::error::proof SHA binding failed: lastComparedMainSha=$LAST_COMPARED candidate=$CANDIDATE_SHA"
            exit 1
          fi
          BEHAVIOR_ARTIFACT="${SCRATCH_DIR}/v3014-behavior-result.json"
          if [ ! -f "$BEHAVIOR_ARTIFACT" ]; then
            echo "::error::v3.0.14 behavior result missing at $BEHAVIOR_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_behavior_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 14 and .passed == 14 and .skipped == 0
          ' "$BEHAVIOR_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 behavior result is incomplete, failing, or not SHA-bound"
            exit 1
          }
          TEXT_LAYER_ARTIFACT="${SCRATCH_DIR}/v3014-text-layer-result.json"
          if [ ! -f "$TEXT_LAYER_ARTIFACT" ]; then
            echo "::error::v3.0.14 text-layer result missing at $TEXT_LAYER_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_text_layer_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 1 and .passed == 1 and .skipped == 0 and
            .geometryMutationSensitive == true
          ' "$TEXT_LAYER_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 text-layer result is incomplete, failing, or not SHA-bound"
            exit 1
          }
          CITATION_CHUNK_ARTIFACT="${SCRATCH_DIR}/v3014-citation-chunk-result.json"
          if [ ! -f "$CITATION_CHUNK_ARTIFACT" ]; then
            echo "::error::v3.0.14 citation-chunk result missing at $CITATION_CHUNK_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_citation_chunk_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 6 and .passed == 6 and .skipped == 0 and
            .chunkMutationSensitive == true
          ' "$CITATION_CHUNK_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 citation-chunk result is incomplete, failing, or not SHA-bound"
            exit 1
          }
          SEMANTIC_HINT_ARTIFACT="${SCRATCH_DIR}/v3014-semantic-hint-result.json"
          if [ ! -f "$SEMANTIC_HINT_ARTIFACT" ]; then
            echo "::error::v3.0.14 semantic-hint result missing at $SEMANTIC_HINT_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_semantic_hint_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 3 and .passed == 3 and .skipped == 0 and
            .mutationSensitive.role == true and
            .mutationSensitive.confidence == true and
            .mutationSensitive.signals == true and
            .mutationSensitive.level == true
          ' "$SEMANTIC_HINT_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 semantic-hint result is incomplete, mutation-insensitive, failing, or not SHA-bound"
            exit 1
          }
          DOCUMENT_AST_ARTIFACT="${SCRATCH_DIR}/v3014-document-ast-result.json"
          if [ ! -f "$DOCUMENT_AST_ARTIFACT" ]; then
            echo "::error::v3.0.14 document-AST result missing at $DOCUMENT_AST_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_document_ast_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 6 and .passed == 6 and .skipped == 0 and
            .subprocessNonzeroRejected == true and
            .mutationSensitive.allClaimedFields == true and
            .mutationSensitive.manifestVersion == 1 and
            .mutationSensitive.mutationManifestSha256 == "6a24391c42d4d6b7fd2e6007f0f807058a1aa78872dbb7f83ab6525752c40dfb" and
            .mutationSensitive.leafMutationCount == 2384 and
            .mutationSensitive.wrongPrimitiveTypeProbeCount == 8 and
            .mutationSensitive.unexpectedFieldProbeCount == 5 and
            .mutationSensitive.requiredOmissionProbeCount == 4 and
            .mutationSensitive.privateLeakProbeCount == 5 and
            .mutationSensitive.dependencyPresenceProbeCount == 10
          ' "$DOCUMENT_AST_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 document-AST result is incomplete, mutation-insensitive, failing, or not SHA-bound"
            exit 1
          }
          DOCUMENT_MAP_ARTIFACT="${SCRATCH_DIR}/v3014-document-map-result.json"
          if [ ! -f "$DOCUMENT_MAP_ARTIFACT" ]; then
            echo "::error::v3.0.14 document-map result missing at $DOCUMENT_MAP_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_document_map_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 8 and .passed == 8 and .skipped == 0 and
            .subprocessNonzeroRejected == true and
            .mutationSensitive.allClaimedFields == true and
            .mutationSensitive.manifestVersion == 1 and
            .mutationSensitive.mutationManifestSha256 == "64c5d3ce6733c76d7c31f54577e6b3e73f060776b0898fbffbbef1075456390c" and
            .mutationSensitive.leafMutationCount == 3189 and
            .mutationSensitive.wrongPrimitiveTypeProbeCount == 6 and
            .mutationSensitive.unexpectedFieldProbeCount == 8 and
            .mutationSensitive.requiredOmissionProbeCount == 6 and
            .mutationSensitive.privateLeakProbeCount == 6 and
            .mutationSensitive.dependencyPresenceProbeCount == 14 and
            .mutationSensitive.hostileSpanBounded == true and
            (.cacheIdentity | to_entries | all(.value == true))
          ' "$DOCUMENT_MAP_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 document-map result is incomplete, mutation-insensitive, failing, or not SHA-bound"
            exit 1
          }
          TRUST_REPORT_ARTIFACT="${SCRATCH_DIR}/v3014-trust-report-result.json"
          if [ ! -f "$TRUST_REPORT_ARTIFACT" ]; then
            echo "::error::v3.0.14 trust-report result missing at $TRUST_REPORT_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_trust_report_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 9 and .passed == 9 and .skipped == 0 and
            .subprocessNonzeroRejected == true and
            .mutationSensitive.allClaimedFields == true and
            .mutationSensitive.manifestVersion == 1 and
            .mutationSensitive.mutationManifestSha256 == "28c02c6a9fa184c311fc06ddcb0cc21864f462c05d53447fc69fa019d6ec08e1" and
            .mutationSensitive.leafMutationCount == 1117 and
            .mutationSensitive.wrongPrimitiveTypeProbeCount == 12 and
            .mutationSensitive.unexpectedFieldProbeCount == 5 and
            .mutationSensitive.requiredOmissionProbeCount == 12 and
            .mutationSensitive.privateLeakProbeCount == 5 and
            .mutationSensitive.dependencyPresenceProbeCount == 15 and
            .hiddenDependencyBehavior == true and .selectedPageScope == true and
            (.redactionProof | to_entries | all(.value == true)) and
            (.annotationProof | to_entries | all(.value == true)) and
            (.dependencyReuse | to_entries | all(.value == true)) and
            (.mapLinkage | to_entries | all(.value == true))
          ' "$TRUST_REPORT_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 trust-report result is incomplete, mutation-insensitive, failing, or not SHA-bound"
            exit 1
          }
          SELECTABLE_TABLE_ARTIFACT="${SCRATCH_DIR}/v3014-selectable-table-result.json"
          if [ ! -f "$SELECTABLE_TABLE_ARTIFACT" ]; then
            echo "::error::v3.0.14 selectable-table result missing at $SELECTABLE_TABLE_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_selectable_table_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 6 and .passed == 6 and .skipped == 0 and
            .subprocessNonzeroRejected == true and
            .mutationSensitive.allClaimedFields == true and
            .mutationSensitive.manifestVersion == 1 and
            .mutationSensitive.mutationManifestSha256 == "7ea2129614c89d9d50707d1f96a802bfe485f10ecc576989f9ac99be610df893" and
            .mutationSensitive.leafMutationCount == 1625 and
            .mutationSensitive.wrongPrimitiveTypeProbeCount == 7 and
            .mutationSensitive.unexpectedFieldProbeCount == 11 and
            .mutationSensitive.requiredOmissionProbeCount == 7 and
            .mutationSensitive.privateLeakProbeCount == 5 and
            .mutationSensitive.dependencyPresenceProbeCount == 13 and
            (.semanticProof | to_entries | all(.value == true)) and
            (.continuationProof | to_entries | all(.value == true)) and
            .resourceBoundProof.exactCapItemCount == 4096 and
            .resourceBoundProof.itemCount == 4097 and
            .resourceBoundProof.cap == 4096 and
            .resourceBoundProof.exactCapAccepted == true and
            .resourceBoundProof.zeroTables == true and
            .resourceBoundProof.exactWarning == true
          ' "$SELECTABLE_TABLE_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 selectable-table result is incomplete, mutation-insensitive, failing, or not SHA-bound"
            exit 1
          }
          CAPTION_LINK_ARTIFACT="${SCRATCH_DIR}/v3014-caption-link-result.json"
          if [ ! -f "$CAPTION_LINK_ARTIFACT" ]; then
            echo "::error::v3.0.14 caption-link result missing at $CAPTION_LINK_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_caption_link_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 6 and .passed == 6 and .skipped == 0 and
            .mutationSensitive.allClaimedFields == true and
            .mutationSensitive.manifestVersion == 1 and
            .mutationSensitive.mutationManifestSha256 == "4e7807a895abaaba895ccdcd7096d768d57c72a92674a530afb8c58e31cf8e54" and
            .mutationSensitive.leafMutationCount == 493 and
            .mutationSensitive.wrongPrimitiveTypeProbeCount == 5 and
            .mutationSensitive.unexpectedFieldProbeCount == 4 and
            .mutationSensitive.requiredOmissionProbeCount == 5 and
            .mutationSensitive.privateLeakProbeCount == 5 and
            .mutationSensitive.dependencyPresenceProbeCount == 12
          ' "$CAPTION_LINK_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 caption-link result is incomplete, mutation-insensitive, failing, or not SHA-bound"
            exit 1
          }
          SEARCH_SEMANTIC_ARTIFACT="${SCRATCH_DIR}/v3014-search-semantic-result.json"
          if [ ! -f "$SEARCH_SEMANTIC_ARTIFACT" ]; then
            echo "::error::v3.0.14 search-semantic result missing at $SEARCH_SEMANTIC_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_search_semantic_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 12 and .passed == 12 and .skipped == 0 and
            .mutationSensitive.allClaimedFields == true and
            .mutationSensitive.manifestVersion == 1 and
            .mutationSensitive.mutationManifestSha256 == "b5f9aebf64bea4633376fdab137f57369d845173996ce21fb1b3bfe748c0481c" and
            .mutationSensitive.leafMutationCount == 171 and
            .mutationSensitive.wrongPrimitiveTypeProbeCount == 4 and
            .mutationSensitive.unexpectedFieldProbeCount == 2 and
            .mutationSensitive.requiredOmissionProbeCount == 2 and
            .omissionProof.noWarnings == true and .omissionProof.noTruncated == true and
            .nonclaim.utf16SplitSurrogateWireParity == false and .nonclaim.failClosedProof == true and
            .productTruth.dropInFor3014 == false and .productTruth.publishFreeze == true
          ' "$SEARCH_SEMANTIC_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 search-semantic result is incomplete, mutation-insensitive, failing, or not SHA-bound"
            exit 1
          }
          LOWERCASE_INDEX_ARTIFACT="${SCRATCH_DIR}/v3014-lowercase-index-result.json"
          if [ ! -f "$LOWERCASE_INDEX_ARTIFACT" ]; then
            echo "::error::v3.0.14 lowercase-index result missing at $LOWERCASE_INDEX_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_lowercase_index_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 6 and .passed == 6 and .skipped == 0 and
            .localeContract.defaultLocale == "en-US" and
            .localeContract.sentinel == "İX" and .localeContract.lowercase == "i̇x" and
            .mutationSensitive.allClaimedFields == true and
            .mutationSensitive.manifestVersion == 1 and
            .mutationSensitive.mutationManifestSha256 == "ec260134fe80513ee741b5b02c47830a9e3cc409a6420fc9fd5020f0f4662ec4" and
            .mutationSensitive.leafMutationCount == 43 and
            .mutationSensitive.wrongPrimitiveTypeProbeCount == 5 and
            .mutationSensitive.unexpectedFieldProbeCount == 2 and
            .mutationSensitive.requiredOmissionProbeCount == 3 and
            .omissionProof.noWarnings == true and .omissionProof.noTruncated == true and
            (.nonclaims | to_entries | all(.value == false)) and
            .productTruth.dropInFor3014 == false and .productTruth.publishFreeze == true
          ' "$LOWERCASE_INDEX_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 lowercase-index result is incomplete, mutation-insensitive, failing, or not SHA-bound"
            exit 1
          }
          SELECTABLE_TEXT_SEGMENTATION_ARTIFACT="${SCRATCH_DIR}/v3014-selectable-text-segmentation-result.json"
          if [ ! -f "$SELECTABLE_TEXT_SEGMENTATION_ARTIFACT" ]; then
            echo "::error::v3.0.14 selectable-text-segmentation result missing at $SELECTABLE_TEXT_SEGMENTATION_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_selectable_text_segmentation_result" and
